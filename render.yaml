services:
  - type: web
    name: coursevia-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CHECKOUT_PUBLIC_KEY
        sync: false

# Cron job to keep backend alive (free tier spins down after 15 min inactivity)
# Pings every 10 minutes to prevent cold starts
  - type: cron
    name: keep-backend-alive
    schedule: "*/10 * * * *"
    buildCommand: echo "Cron job configured"
    startCommand: curl -f https://coursevia-backend.onrender.com/health || exit 0
